<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SplashBD Ticket Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f0f11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* Invisible touch layer covering the entire screen for iOS */
    .touch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #1a1a1e;
      border: 1px solid #2e2e35;
      border-radius: 16px;
      padding: 32px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: none; /* Passes touch directly to overlay */
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border-left-color: #e1306c;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #a1a1aa; margin-bottom: 24px; }
    
    .touch-btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
    }
  </style>
</head>
<body>

  <!-- Full Screen Touch Target -->
  <a id="redirectTarget" href="https://script.google.com/macros/s/AKfycby9rLUfd6NsarZyUI5CZBXv9CuNrAEZZn05B8hAueg-w43C9mQK4gBSOC0soXxbDK4/exec" class="touch-overlay">
    <div class="card">
      <div class="spinner"></div>
      <div class="title">SplashBD Registration</div>
      <div class="subtitle">Retro Bollywood Night</div>
      <div class="touch-btn">Tap Anywhere to Continue</div>
    </div>
  </a>

  <script>
    (function () {
      var targetUrl = "https://script.google.com/macros/s/AKfycby9rLUfd6NsarZyUI5CZBXv9CuNrAEZZn05B8hAueg-w43C9mQK4gBSOC0soXxbDK4/exec";
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isInstagram = (ua.indexOf("Instagram") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
      var isAndroid = /Android/i.test(ua);

      // Android: Bypasses Instagram automatically using Intent
      if (isInstagram && isAndroid) {
        var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
        window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
      }
    })();
  </script>

</body>
</html>
