<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      background-color: #0f0f11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #e1306c;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div>
    <div class="spinner"></div>
    <p>Opening Registration Form...</p>
  </div>

  <script>
    (function () {
      // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
      var targetUrl = "https://script.google.com/macros/s/AKfycby7jiapxcxDqedMXOxtKfqK5c5tcVXmsGhqdi4Myl6HjWPQ4acwpB6Sx-bii1dmWNlrcA/exec";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isInstagram = (ua.indexOf("Instagram") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);

      if (isInstagram) {
        if (isAndroid) {
          // Android: Direct native Chrome launch via intent
          var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
          window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } 
        else if (isIOS) {
          // iOS Workaround: Trigger Safari system handler via x-web-search protocol force
          var cleanTarget = targetUrl.replace(/^https?:\/\//, '');
          
          // 1. Try Safari system protocol bypass
          window.location.href = "x-web-search://?" + cleanTarget;

          // 2. Fallback: Force a Blob download file trigger that iOS Safari opens externally
          setTimeout(function() {
            var htmlContent = '<script>window.location.href="' + targetUrl + '";<\/script>';
            var blob = new Blob([htmlContent], { type: 'text/html' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.target = '_blank';
            a.click();
          }, 300);
        }
      } else {
        // Normal Browser / Safari / Desktop
        window.location.href = targetUrl;
      }
    })();
  </script>

</body>
</html>
