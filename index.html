<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SplashBD Ticket Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0f11;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #1a1a1e;
      border: 1px solid #2e2e35;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: #e1306c;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .instructions-box {
      margin-top: 24px;
      background: #24242a;
      border: 1px solid #383842;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
    }

    .instructions-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffcc00;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .step {
      font-size: 13.5px;
      color: #d4d4d8;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .step strong {
      color: #ffffff;
    }

    .arrow-indicator {
      position: absolute;
      top: 12px;
      right: 20px;
      font-size: 28px;
      color: #ffcc00;
      animation: bounce 1.2s infinite;
      display: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div id="iosArrow" class="arrow-indicator">↗</div>

  <div class="card">
    <div class="logo-title">SplashBD Registration</div>
    <div class="subtitle">Retro Bollywood Night</div>

    <a id="openFormBtn" href="#" class="btn">Open Registration Form</a>

    <div class="instructions-box">
      <div class="instructions-title">If page shows blank or fails:</div>
      <div class="step">1. Tap <strong>···</strong> (three dots) in top-right corner.</div>
      <div class="step">2. Select <strong>"Open in System Browser"</strong> or <strong>"Open in Safari / Chrome"</strong>.</div>
    </div>
  </div>

  <script>
    (function () {
      // Replace with your Google Apps Script Web App URL
      var targetUrl = "https://script.google.com/macros/s/AKfycby7jiapxcxDqedMXOxtKfqK5c5tcVXmsGhqdi4Myl6HjWPQ4acwpB6Sx-bii1dmWNlrcA/exec";

      var openBtn = document.getElementById("openFormBtn");
      openBtn.href = targetUrl;

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isInstagram = (ua.indexOf("Instagram") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);

      if (isInstagram) {
        // Android: Force open inside Chrome app natively
        if (/Android/i.test(ua)) {
          var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
          window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } 
        // iOS: Show point arrow for top-right menu trigger
        else if (/iPhone|iPad|iPod/i.test(ua)) {
          document.getElementById("iosArrow").style.display = "block";
        }
      } else {
        // Standard Browser (Safari, Chrome, Desktop): Direct redirect
        window.location.href = targetUrl;
      }
    })();
  </script>

</body>
</html>
